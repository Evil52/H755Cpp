sonar.projectKey=h755cpp
sonar.projectName=H755Cpp
sonar.sourceEncoding=UTF-8
sonar.sources=include,src,tools,firmware
sonar.tests=tests
sonar.exclusions=tools/probes/**,security/semgrep/**,**/__pycache__/**,**/*.pyc
sonar.test.exclusions=**/__pycache__/**,**/*.pyc
sonar.python.version=3.12
sonar.cxx.file.suffixes=.hpp,.h,.cpp
sonar.cxx.includeDirectories=include,src/usb,firmware/cm7,vendor/cmsis-core/Include,vendor/cmsis-device-h7/Include,vendor/tinyusb/src,vendor/async/include,vendor/concurrency/include,vendor/stdx/include,vendor/mp11/include
sonar.cxx.defines=STM32H755xx,CORE_CM7,H755_USB_CDC=1,SIMULATE_FREESTANDING=1,CFG_TUSB_MCU=OPT_MCU_STM32H7
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=180
sonar.cxx.errorRecoveryEnabled=false
