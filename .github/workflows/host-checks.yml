name: Host checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
          python3 -m venv /tmp/h755-ci-tools
          /tmp/h755-ci-tools/bin/pip install cmake==3.31.6
          echo /tmp/h755-ci-tools/bin >> "$GITHUB_PATH"
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug --parallel 2
      - name: Unit and host integration with ASan/UBSan
        run: ctest --preset host-debug --no-tests=error
