name: Firmware artifact

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact merged PR and successful checks
        id: pr_gate
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/verify_release_ci.py \
            --repository "$REPOSITORY" --merge-commit "$MERGE_COMMIT" \
            --main-ci-run '${{ github.event.workflow_run.id }}' \
            --output "$GITHUB_OUTPUT"
      - name: Download pinned GCC 16.2 toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchain-gcc-16.2.0-cm7 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern h755-arm-gcc-16.2.0-cm7-macos-arm64.tar.gz \
            --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            c6ad25058ac5143dc82d7cf4fc98a1403e305e278109a837ed8c1b4a0b1eb60f \
            "$RUNNER_TEMP/h755-arm-gcc-16.2.0-cm7-macos-arm64.tar.gz" |
            shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/h755-toolchain"
          tar -xzf "$RUNNER_TEMP/h755-arm-gcc-16.2.0-cm7-macos-arm64.tar.gz" \
            -C "$RUNNER_TEMP/h755-toolchain" --strip-components 1
          echo "H755_ARM_TOOLCHAIN=$RUNNER_TEMP/h755-toolchain" >> "$GITHUB_ENV"
      - name: Install pinned CMake
        run: |
          python3 -m venv "$RUNNER_TEMP/h755-cmake"
          "$RUNNER_TEMP/h755-cmake/bin/pip" install cmake==3.31.6
          echo "$RUNNER_TEMP/h755-cmake/bin" >> "$GITHUB_PATH"
      - name: Build merged Release images
        run: |
          cmake --preset cm7-ethernet-release
          cmake --build --preset cm7-ethernet-release --parallel 2
      - name: Package and verify exact firmware bytes
        env:
          MERGE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          MAIN_CI_RUN: ${{ github.event.workflow_run.id }}
          PR_CI_RUN: ${{ steps.pr_gate.outputs.pr_ci_run_id }}
        run: |
          python3 tools/firmware_artifact.py create \
            --source . --build build/cm7-ethernet-release \
            --output build/release-artifact \
            --preset cm7-ethernet-release \
            --main-ci-run "$MAIN_CI_RUN" --pr-ci-run "$PR_CI_RUN" \
            --toolchain "$H755_ARM_TOOLCHAIN" \
            --expected-commit "$MERGE_COMMIT"
          python3 tools/firmware_artifact.py verify \
            --bundle build/release-artifact \
            --expected-commit "$MERGE_COMMIT" \
            --expected-preset cm7-ethernet-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h755-firmware-${{ github.event.workflow_run.head_sha }}
          path: build/release-artifact/
          if-no-files-found: error
          retention-days: 90
